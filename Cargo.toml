[package]
name = "lilbox"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A lil exe.dev you run on your own box"

[[bin]]
name = "lilbox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "6"
flate2 = "1"
futures = "0.3"
microsandbox = { version = "0.6.12", default-features = false, features = ["net", "prebuilt", "ssh"] }
oci-client = "0.17"
oci-spec = "0.10"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
shlex = "1"
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
toml = "0.9"
russh = "0.63"
pty-process = { version = "0.5", features = ["async"] }
libc = "0.2"
rand10 = { package = "rand", version = "0.10", features = ["thread_rng"] }

[profile.release]
strip = true
lto = "thin"
