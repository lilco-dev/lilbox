[package]
name = "lilbox"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A lil exe.dev you run on your own box"
repository = "https://github.com/lilco-dev/lilbox"
readme = "README.md"
keywords = ["microvm", "tailscale", "sandbox", "libkrun", "dev-environments"]
categories = ["command-line-utilities", "development-tools"]
# Ship the crate, not the repo: rig/agent tooling, media, and the Docker
# image build are dev-side only. templates/ MUST stay (include_str! embeds
# them into the binary at compile time).
exclude = [
    "/.agents",
    "/.claude",
    "/.rig",
    "/.github",
    "/docs",
    "/contrib",
    "/images/lilbox-box/Dockerfile",
    "/images/lilbox-box/build.sh",
    "/images/lilbox-box/README.md",
    "/install.sh",
    "/config.toml.example",
    "/AGENTS.md",
    "/CLAUDE.md",
]

[[bin]]
name = "lilbox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "6"
flate2 = "1"
futures = "0.3"
microsandbox = { version = "0.6.12", default-features = false, features = ["net", "prebuilt", "ssh"] }
open = "5"
oci-client = "0.17"
oci-spec = "0.10"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
shlex = "1"
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
toml = "0.9"
russh = "0.63"
pty-process = { version = "0.5", features = ["async"] }
libc = "0.2"
rand10 = { package = "rand", version = "0.10", features = ["thread_rng"] }

[profile.release]
strip = true
lto = "thin"
