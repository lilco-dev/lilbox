# lilbox plugin for herdr (https://herdr.dev/docs/plugins/).
#
#   herdr plugin link   /path/to/lilbox/contrib/herdr     # local development
#   herdr plugin install lilco-dev/lilbox/contrib/herdr    # from GitHub
#
# Every entrypoint routes through ./bin/lilbox-herdr. Herdr runs plugin commands
# as a bare argv with no shell expansion and with the *plugin directory* as the
# working directory, so the shim resolves the real worktree from
# HERDR_PLUGIN_CONTEXT_JSON rather than from $PWD.
id = "lilbox"
name = "lilbox"
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["linux"]                 # microsandbox needs KVM
description = "Run agents in libkrun microVMs on your own hardware: one lilbox per worktree, torn down with it."

# Boot (or reuse) this worktree's box and drop into an interactive shell at
# /workspace. Zoomed: you're working inside the box, so there's nothing local to
# keep beside it.
#
# Pane commands launch via `sh -c` and reach the shim by absolute path through
# $HERDR_PLUGIN_ROOT: herdr's pane spawner resolves argv[0] against PATH (unlike
# the action runner, which honours the plugin dir), so a relative `bin/...`
# program fails with "not found in PATH". The one-shot actions below keep the
# direct `bin/lilbox-herdr` form, which the action runner resolves fine.
[[panes]]
id = "box"
title = "lilbox"
placement = "zoomed"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/lilbox-herdr\" open"]

# Same box, but exec straight into the coding agent. This is the pane herdr's
# agent state detection (working / blocked / done / idle) reads.
[[panes]]
id = "agent"
title = "lilbox agent"
placement = "zoomed"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/lilbox-herdr\" agent"]

# Live box list, refreshed in place. Popup rather than overlay: overlays are
# normal tiled panes (the window grows, then re-tiles small around them),
# while a popup floats modally at a fixed size and never disturbs the layout.
[[panes]]
id = "boxes"
title = "lilbox boxes"
placement = "popup"
width = "80%"
height = "60%"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/lilbox-herdr\" watch"]

# fzf picker over every box — attach, stop, destroy, expose — regardless of
# which workspace (if any) created it. Transient by nature, so a popup.
[[panes]]
id = "manage"
title = "lilbox manage"
placement = "popup"
width = "80%"
height = "60%"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/lilbox-herdr\" manage"]

# Actions register the plugin's verbs with herdr. Invoke any of them with
#   herdr plugin action invoke lilbox.<id>
# or bind a key in your herdr config, e.g.:
#   [[keys.command]]
#   key = "prefix+shift+b"
#   type = "plugin_action"
#   command = "lilbox.open"
#   description = "open lilbox"
# Only `open` and `agent` want an interactive pane; the one-shot verbs below
# print to the plugin command log (herdr plugin log list --plugin lilbox).

[[actions]]
id = "open"
title = "lilbox: open box shell"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "lilbox", "--entrypoint", "box"]

[[actions]]
id = "agent"
title = "lilbox: run agent in box"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "lilbox", "--entrypoint", "agent"]

[[actions]]
id = "boxes"
title = "lilbox: boxes popup"
contexts = ["global"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "lilbox", "--entrypoint", "boxes"]

[[actions]]
id = "status"
title = "lilbox: box status"
contexts = ["workspace"]
command = ["bin/lilbox-herdr", "status"]

[[actions]]
id = "expose"
title = "lilbox: publish box over tailnet HTTPS"
contexts = ["workspace"]
command = ["bin/lilbox-herdr", "expose"]

[[actions]]
id = "unexpose"
title = "lilbox: stop publishing box"
contexts = ["workspace"]
command = ["bin/lilbox-herdr", "unexpose"]

[[actions]]
id = "kill"
title = "lilbox: destroy box"
contexts = ["workspace"]
command = ["bin/lilbox-herdr", "kill"]

[[actions]]
id = "manage"
title = "lilbox: manage boxes"
contexts = ["global"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "lilbox", "--entrypoint", "manage"]

# Destroy every worktree-backed box whose worktree is gone. Catches boxes from
# worktrees created outside herdr (e.g. by agents), whose removal never fires
# the worktree.removed hook below.
[[actions]]
id = "gc"
title = "lilbox: destroy stale boxes"
contexts = ["global"]
command = ["bin/lilbox-herdr", "gc"]

[[actions]]
id = "open-url"
title = "lilbox: open box for a URL"
contexts = ["global"]
command = ["bin/lilbox-herdr", "open-url"]

# Ctrl+click a published box URL in any pane to shell into the box serving it,
# instead of opening the URL in a browser. Link handler actions receive the
# clicked URL in HERDR_PLUGIN_CLICKED_URL.
[[link_handlers]]
id = "box-url"
title = "lilbox: open the box behind this URL"
pattern = "^https://[a-zA-Z0-9._-]+\\.ts\\.net(:[0-9]+)?(/|$)"
action = "open-url"

# Keep the sidebar's $lilbox token fresh: report each pane's box state
# (running/stopped/none) as pane metadata. Best-effort; hook never fails.
[[events]]
on = "pane.created"
command = ["bin/lilbox-herdr", "hook"]

[[events]]
on = "pane.focused"
command = ["bin/lilbox-herdr", "hook"]

# Worktree removed -> destroy its box. Without this, every discarded worktree
# leaves a microVM and its home volume behind.
[[events]]
on = "worktree.removed"
command = ["bin/lilbox-herdr", "teardown"]
